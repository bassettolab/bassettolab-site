<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="t d">
<title id="t">nItemPed limitation and infAdProd alternative</title>
<desc id="d">A generic line identifier longer than six digits does not fit in nItemPed, so infAdProd can carry the full identifier.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f2747}.title{font-size:34px;font-weight:700}.h{font-size:26px;font-weight:700}.s{font-size:20px}.box{rx:22;ry:22;stroke-width:2}.arrow{stroke:#64748b;stroke-width:5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1400" height="500" fill="#fff"/>
<text x="700" y="60" class="title" text-anchor="middle">nItemPed Limitation and infAdProd Alternative</text>
<rect class="box" x="80" y="150" width="300" height="190" fill="#eef6ff" stroke="#93c5fd"/>
<text x="230" y="205" class="h" text-anchor="middle">Line Identifier</text>
<text x="230" y="255" class="s" text-anchor="middle">ID &gt; 6 digits</text>
<path class="arrow" d="M380 245 H470"/>
<rect class="box" x="480" y="120" width="350" height="120" fill="#fff7ed" stroke="#fdba74"/>
<text x="655" y="170" class="h" text-anchor="middle">nItemPed</text>
<text x="655" y="207" class="s" text-anchor="middle">maximum 6 digits</text>
<rect class="box" x="480" y="270" width="350" height="120" fill="#eefbf4" stroke="#86efac"/>
<text x="655" y="320" class="h" text-anchor="middle">infAdProd</text>
<text x="655" y="357" class="s" text-anchor="middle">carries the full identifier</text>
<path class="arrow" d="M830 330 H930"/>
<rect class="box" x="940" y="150" width="380" height="190" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1130" y="205" class="h" text-anchor="middle">Inbound Mapping</text>
<text x="1130" y="250" class="s" text-anchor="middle">xPed → Shipment Number</text>
<text x="1130" y="290" class="s" text-anchor="middle">infAdProd → Full Line ID</text>
<text x="700" y="450" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#64748b" text-anchor="middle">Generic example. Validate fiscal use of infAdProd before implementation.</text>
</svg>