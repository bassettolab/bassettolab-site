<path class="arrow" d="M1170 250 H1225"/>
<rect class="box" x="1230" y="195" width="185" height="110" fill="#ecfeff"/><text class="lbl" x="1322" y="235"><tspan x="1322">Collaboration</tspan><tspan x="1322" dy="24">Messaging</tspan><tspan x="1322" dy="24">(XSL)</tspan></text>
<path class="arrow" d="M1415 250 H1460"/>
<rect class="box" x="1465" y="205" width="90" height="90" fill="#fff7ed"/><text class="lbl" x="1510" y="258">FDC</text>
