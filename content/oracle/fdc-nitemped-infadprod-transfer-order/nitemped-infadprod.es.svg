<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f2747}.t{font-size:34px;font-weight:700}.h{font-size:26px;font-weight:700}.s{font-size:20px}.r{rx:22;ry:22;stroke-width:2}.a{stroke:#64748b;stroke-width:5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#64748b"/></marker></defs><rect width="1400" height="500" fill="#fff"/><text x="700" y="60" class="t" text-anchor="middle">Limitación de nItemPed y alternativa con infAdProd</text><rect class="r" x="80" y="150" width="300" height="190" fill="#eef6ff" stroke="#93c5fd"/><text x="230" y="205" class="h" text-anchor="middle">Identificador de línea</text><text x="230" y="255" class="s" text-anchor="middle">ID &gt; 6 dígitos</text><path class="a" d="M380 245H470"/><rect class="r" x="480" y="120" width="350" height="120" fill="#fff7ed" stroke="#fdba74"/><text x="655" y="170" class="h" text-anchor="middle">nItemPed</text><text x="655" y="207" class="s" text-anchor="middle">máximo de 6 dígitos</text><rect class="r" x="480" y="270" width="350" height="120" fill="#eefbf4" stroke="#86efac"/><text x="655" y="320" class="h" text-anchor="middle">infAdProd</text><text x="655" y="357" class="s" text-anchor="middle">transporta el ID completo</text><path class="a" d="M830 330H930"/><rect class="r" x="940" y="150" width="380" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="1130" y="205" class="h" text-anchor="middle">Mapeo de entrada</text><text x="1130" y="250" class="s" text-anchor="middle">xPed → Shipment Number</text><text x="1130" y="290" class="s" text-anchor="middle">infAdProd → ID completo</text><text x="700" y="450" font-family="Arial" font-size="17" fill="#64748b" text-anchor="middle">Ejemplo genérico. Valide el uso fiscal de infAdProd antes de implementarlo.</text></svg>