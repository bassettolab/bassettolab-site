# Hugo configuration file
baseURL: "https://bassettolab.com/"
title: "BassettoLab.com"
languageCode: "pt-BR"
defaultContentLanguage: "pt-br"
enableEmoji: true

languages:
  pt-br:
    languageName: "Português"
    languageCode: "pt-BR"
    weight: 1
  es:
    languageName: "Español"
    languageCode: "es"
    weight: 2
  en:
    languageName: "English"
    languageCode: "en"
    weight: 3

outputs:
  home: [HTML, RSS]

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

menu:
  main:
    - name: Blog
      pageRef: /
      weight: 1
    - name: Sobre
      pageRef: /about
      weight: 2
    - name: Arquivo
      pageRef: /archives
      weight: 3
    - name: Oracle
      pageRef: /oracle
      weight: 4
    - name: Livros
      pageRef: /livros
      weight: 5
    - name: GitHub
      weight: 6
      url: "https://github.com/bassettolab/bassettolab-site"
      params:
        icon: github
    - name: Buscar
      weight: 7
      params:
        type: search
    - name: Idioma
      weight: 8
      params:
        type: language-switch
    - name: Tema
      weight: 9
      params:
        type: theme-toggle
    - name: Paleta
      weight: 10
      params:
        type: palette-switch

params:
  navbar:
    displayTitle: true
    displayLogo: false

  search:
    enable: true
    type: flexsearch

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: false
    base: "https://github.com/bassettolab/bassettolab-site/edit/main/content"

  description: "BassettoLab — base pessoal de conhecimento sobre Oracle, tecnologia, produtividade, livros, ideias e experimentos."

  # Configure o endpoint após implantar analytics/app.py no servidor.
  analytics:
    endpoint: ""
