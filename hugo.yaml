# Hugo configuration file
baseURL: "https://bassettolab.com/"
title: "BassettoLab"
languageCode: "pt-BR"
defaultContentLanguage: "pt-br"
enableEmoji: true

outputs:
  home: [HTML, RSS]

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true

  highlight:
    noClasses: false

menu:
  main:
    - name: Tema
      weight: 0
      params:
        type: theme-toggle
    - name: Sobre
      pageRef: /about
      weight: 1
    - name: Arquivo
      pageRef: /archives
      weight: 2
    - name: GitHub
      weight: 3
      url: "https://github.com/bassettolab/bassettolab-site"
      params:
        icon: github
    - name: Buscar
      weight: 4
      params:
        type: search
    - name: RSS
      weight: 5
      url: "/index.xml"
      params:
        icon: rss

params:
  navbar:
    displayTitle: true
    displayLogo: false

  search:
    enable: true
    type: flexsearch

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/bassettolab/bassettolab-site/edit/main/content"

  description: "BassettoLab — base pessoal de conhecimento sobre Oracle, tecnologia, produtividade, livros, ideias e experimentos."
