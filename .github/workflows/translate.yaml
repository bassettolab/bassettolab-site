name: Translate Hugo articles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-hugo-main
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check OpenAI API key
        id: api_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured. Translation workflow is inactive."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenAI SDK
        if: steps.api_key.outputs.enabled == 'true'
        run: pip install --disable-pip-version-check openai

      - name: Find Portuguese source articles
        if: steps.api_key.outputs.enabled == 'true'
        shell: bash
        run: |
          find content -type f -name 'index.md' | sort > /tmp/translation_sources.txt
          cat /tmp/translation_sources.txt

      - name: Translate to English and Spanish
        if: steps.api_key.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        shell: bash
        run: |
          mapfile -t files < /tmp/translation_sources.txt
          if [ "${#files[@]}" -eq 0 ] || [ -z "${files[0]}" ]; then
            echo "No Portuguese source articles found."
            exit 0
          fi
          python .github/scripts/translate_hugo.py "${files[@]}"

      - name: Commit translations
        if: steps.api_key.outputs.enabled == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Update EN and ES translations"
          git push
