<style>
  :root {
    --bsl-accent: #65a30d;
    --bsl-accent-soft: color-mix(in srgb, #65a30d 16%, transparent);
    --bsl-accent-secondary: #84cc16;
  }

  html.dark {
    --bsl-accent: #b7ff4a;
    --bsl-accent-soft: color-mix(in srgb, #b7ff4a 18%, transparent);
    --bsl-accent-secondary: #d4ff7a;
  }

  .bsl-home, .bsl-archive { width: 100%; }
  .bsl-home {
    width: min(1120px, calc(100vw - 3rem));
    max-width: none;
    margin-left: 50%;
    transform: translateX(-50%);
  }

  .bsl-home a, .bsl-archive a { text-decoration: none; }
  .bsl-home a:hover, .bsl-archive a:hover { text-decoration: underline; }

  .bsl-home-top {
    display: flex;
    justify-content: space-between;
    gap: 1.25rem;
    align-items: center;
    min-height: 2.35rem;
    margin: .25rem 0 1.25rem;
  }

  .bsl-home-top .bsl-view-toggle {
    flex: 0 0 auto;
  }

  .bsl-archive-lead, .bsl-archive-bottom { margin: 0; }
  .bsl-archive-lead a,
  .bsl-archive-bottom a,
  .bsl-post-title,
  .bsl-card h3 a {
    color: var(--bsl-accent);
  }

  .bsl-view-toggle {
    display: inline-flex;
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    border-radius: .6rem;
    padding: .2rem;
    gap: .15rem;
    white-space: nowrap;
  }

  .bsl-view-button, .bsl-featured-toggle {
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    border-radius: .45rem;
  }

  .bsl-view-button { padding: .45rem .7rem; opacity: .7; }
  .bsl-view-button.is-active {
    opacity: 1;
    background: var(--bsl-accent-soft);
    color: var(--bsl-accent);
  }

  .bsl-featured {
    border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    border-radius: .75rem;
    margin: 0 0 2rem;
    overflow: hidden;
  }

  .bsl-featured-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: .85rem 1rem;
  }

  .bsl-featured-header h2 { margin: 0; font-size: 1.45rem; }
  .bsl-featured-toggle {
    border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
    padding: .3rem .75rem;
  }

  .bsl-featured-body { padding: 0 1rem .9rem; }

  .bsl-page-grid {
    display: grid;
    grid-template-columns: minmax(0, 860px) 180px;
    gap: 3rem;
    align-items: start;
  }

  .bsl-main-column, .bsl-months { min-width: 0; }

  .bsl-month { scroll-margin-top: 5rem; }
  .bsl-month > h2 {
    margin: 1.7rem 0 .9rem;
    padding-bottom: .55rem;
    border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
    text-transform: capitalize;
  }

  .bsl-post-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .bsl-post-list-item {
    display: flex;
    align-items: flex-start;
    gap: .7rem;
    padding: .55rem 0;
  }

  .bsl-post-date {
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .82rem;
    opacity: .62;
    padding-top: .16rem;
  }

  .bsl-diamond {
    color: var(--bsl-accent-secondary);
    font-size: .72rem;
    padding-top: .35rem;
  }

  .bsl-post-list-content { min-width: 0; }
  .bsl-post-title { font-size: 1.02rem; line-height: 1.45; }

  .bsl-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem .55rem;
    margin-top: .18rem;
    font-size: .72rem;
    opacity: .58;
  }

  .bsl-tags a { color: inherit; }

  .bsl-home .bsl-post-title,
  .bsl-home .bsl-card h3 a,
  .bsl-home .bsl-archive-lead a,
  .bsl-home .bsl-archive-bottom a {
    color: #b7ff4a !important;
  }

  .bsl-home .bsl-view-button.is-active {
    color: #b7ff4a !important;
    background: rgba(183, 255, 74, .14) !important;
  }

  .bsl-home .bsl-diamond {
    color: #cfff73 !important;
  }

  html:not(.dark) .bsl-home .bsl-post-title,
  html:not(.dark) .bsl-home .bsl-card h3 a,
  html:not(.dark) .bsl-home .bsl-archive-lead a,
  html:not(.dark) .bsl-home .bsl-archive-bottom a,
  html:not(.dark) .bsl-home .bsl-view-button.is-active {
    color: #4d7c0f !important;
  }

  .bsl-post-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1rem;
  }

  .bsl-card {
    display: flex;
    flex-direction: column;
    min-height: 210px;
    border: 1px solid color-mix(in srgb, var(--bsl-accent) 26%, currentColor 12%);
    border-radius: .85rem;
    padding: 1rem 1rem 1.08rem;
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--bsl-accent) 2%, transparent) 0%,
      transparent 100%
    );
    box-shadow: 0 0 0 rgba(0,0,0,0);
    transition:
      transform .22s ease,
      border-color .22s ease,
      box-shadow .22s ease,
      background .22s ease;
  }

  .bsl-card:hover {
    transform: translateY(-6px);
    border-color: color-mix(in srgb, var(--bsl-accent) 68%, transparent);
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--bsl-accent) 8%, transparent) 0%,
      color-mix(in srgb, var(--bsl-accent) 2%, transparent) 100%
    );
    box-shadow:
      0 12px 28px rgba(0,0,0,.18),
      0 0 0 1px color-mix(in srgb, var(--bsl-accent) 10%, transparent);
  }

  html.dark .bsl-card:hover {
    box-shadow:
      0 14px 30px rgba(0,0,0,.34),
      0 0 18px color-mix(in srgb, var(--bsl-accent) 10%, transparent);
  }

  .bsl-card time {
    font-size: .76rem;
    opacity: .6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .bsl-card h3 {
    margin: .42rem 0 .5rem;
    font-size: 1.05rem;
    line-height: 1.38;
  }

  .bsl-card h3 a {
    transition: color .2s ease;
  }

  .bsl-card:hover h3 a {
    color: var(--bsl-accent-secondary) !important;
    text-decoration: none;
  }

  .bsl-card .bsl-tags {
    margin-top: .08rem;
    margin-bottom: .25rem;
  }

  .bsl-card p {
    margin: .7rem 0 0;
    font-size: .9rem;
    line-height: 1.55;
    opacity: .76;
  }

  [data-bsl-blog][data-view="list"] .bsl-grid-view { display: none; }
  [data-bsl-blog][data-view="grid"] .bsl-list-view { display: none; }

  .bsl-month-nav {
    position: sticky;
    top: 5.5rem;
    align-self: start;
    font-size: .82rem;
    padding: .55rem 0 0;
    min-height: 10rem;
  }

  .bsl-month-nav strong {
    display: block;
    margin: 0 0 .75rem;
    font-size: .86rem;
    font-weight: 700;
    line-height: 1.25rem;
  }

  .bsl-month-nav nav {
    display: flex;
    flex-direction: column;
    gap: .52rem;
  }

  .bsl-month-nav a {
    color: inherit;
    opacity: .62;
    text-transform: capitalize;
    line-height: 1.25;
  }

  .bsl-month-nav a.is-current {
    opacity: 1;
    font-weight: 400;
  }

  .bsl-month-nav a:hover {
    color: var(--bsl-accent);
    opacity: 1;
  }

  .bsl-archive-bottom { margin-top: 2rem; }
  .bsl-archive-year > h2 { margin-top: 2rem; }
  .bsl-archive-year > h3 { margin: 1.2rem 0 .4rem; text-transform: capitalize; }
  .bsl-archive-list { list-style: none; padding: 0; }
  .bsl-archive-list li { display: flex; gap: 1rem; padding: .32rem 0; }
  .bsl-archive-list time { width: 4.6rem; flex: 0 0 auto; opacity: .58; font-size: .82rem; }

  @media (max-width: 1100px) {
    .bsl-post-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 980px) {
    .bsl-home {
      width: 100%;
      margin-left: 0;
      transform: none;
    }

    .bsl-page-grid {
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    .bsl-month-nav { display: none; }
  }

  @media (max-width: 680px) {
    .bsl-home-top {
      align-items: flex-start;
      flex-direction: column;
    }

    .bsl-home-top .bsl-view-toggle {
      align-self: flex-end;
    }

    .bsl-post-grid { grid-template-columns: 1fr; }
  }

  .bsl-article-tags {
    text-align: center;
    margin-top: .65rem;
    font-size: .78rem;
    opacity: .72;
  }

  .bsl-article-meta {
    text-align: center;
    margin-top: 1rem;
    font-size: .9rem;
    color: rgb(148 163 184);
  }

  .bsl-article-meta a {
    color: inherit;
    text-decoration: none;
  }

  .bsl-article-meta a:hover {
    color: var(--bsl-accent);
    text-decoration: underline;
  }

  .bsl-meta-sep { margin: 0 .45rem; }

  .bsl-tldr {
    text-align: center;
    margin-top: .55rem;
    font-size: .9rem;
    color: rgb(148 163 184);
  }

  .bsl-tldr a {
    color: var(--bsl-accent) !important;
    text-decoration: underline;
  }

  .bsl-tldr-menu {
    position: fixed;
    z-index: 100;
    min-width: 132px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    padding: 4px;
    text-align: left;
  }

  .bsl-tldr-menu[hidden] { display: none; }

  .bsl-tldr-menu a {
    display: block;
    padding: 7px 12px;
    border-radius: 6px;
    color: #374151;
    text-decoration: none;
    font-size: .875rem;
  }

  .bsl-tldr-menu a:hover { background: #f3f4f6; }

  html.dark .bsl-tldr-menu {
    background: #1f2937;
    border-color: #374151;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }

  html.dark .bsl-tldr-menu a { color: #e5e7eb; }
  html.dark .bsl-tldr-menu a:hover { background: #374151; }


  .bsl-language-inline {
    display: inline-flex;
    align-items: center;
    gap: .38rem;
    white-space: nowrap;
    font-size: .78rem;
    line-height: 1;
  }

  .bsl-language-link {
    color: rgb(156 163 175);
    text-decoration: none !important;
    font-weight: 400;
    transition: color .15s ease;
  }

  .bsl-language-link:hover {
    color: rgb(229 231 235);
    text-decoration: none !important;
  }

  .bsl-language-link.is-active {
    color: rgb(243 244 246);
    font-weight: 700;
  }

  .bsl-language-separator {
    color: rgb(75 85 99);
    font-weight: 400;
    user-select: none;
  }

  html:not(.dark) .bsl-language-link {
    color: rgb(107 114 128);
  }

  html:not(.dark) .bsl-language-link:hover,
  html:not(.dark) .bsl-language-link.is-active {
    color: rgb(17 24 39);
  }

  html:not(.dark) .bsl-language-separator {
    color: rgb(209 213 219);
  }

</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll("[data-bsl-blog]").forEach(function (root) {
      var saved = localStorage.getItem("bsl-post-view");
      var view = saved === "grid" ? "grid" : "list";

      function setView(next) {
        view = next;
        root.setAttribute("data-view", next);
        localStorage.setItem("bsl-post-view", next);
        root.querySelectorAll("[data-bsl-view]").forEach(function (button) {
          var active = button.getAttribute("data-bsl-view") === next;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      root.querySelectorAll("[data-bsl-view]").forEach(function (button) {
        button.addEventListener("click", function () {
          setView(button.getAttribute("data-bsl-view"));
        });
      });

      setView(view);

      var featuredButton = root.querySelector("[data-bsl-featured-toggle]");
      var featuredBody = root.querySelector("[data-bsl-featured-body]");
      if (featuredButton && featuredBody) {
        featuredButton.addEventListener("click", function () {
          var expanded = featuredButton.getAttribute("aria-expanded") === "true";
          featuredButton.setAttribute("aria-expanded", expanded ? "false" : "true");
          featuredButton.textContent = expanded
            ? (featuredButton.getAttribute("data-bsl-show") || "Mostrar")
            : (featuredButton.getAttribute("data-bsl-hide") || "Esconder");
          featuredBody.hidden = expanded;
        });
      }
    });
  });
</script>
