<script data-bsl-palette-init>
  (function () {
    var root = document.documentElement;
    var dark = root.classList.contains("dark");
    var validDark = ["tech", "cinematic", "editorial", "slate", "hexagonal"];
    var validLight = ["aquatic", "clay", "editorial", "slate", "hexagonal"];

    try {
      var palette = localStorage.getItem("bsl-palette-v3");
      var valid = dark ? validDark : validLight;
      if (valid.indexOf(palette) === -1) palette = dark ? "tech" : "aquatic";
      root.setAttribute("data-bsl-palette", palette);
    } catch (e) {
      root.setAttribute("data-bsl-palette", dark ? "tech" : "aquatic");
    }
  })();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var paletteNames = {
      tech: "Tech",
      cinematic: "Cinematic",
      aquatic: "Aquatic",
      clay: "Argila",
      editorial: "Editorial",
      slate: "Ardósia",
      hexagonal: "Hexagonal"
    };

    var paletteSets = {
      dark: ["tech", "cinematic", "editorial", "slate", "hexagonal"],
      light: ["aquatic", "clay", "editorial", "slate", "hexagonal"]
    };

    function isDarkMode() {
      return document.documentElement.classList.contains("dark");
    }

    function validPalettes() {
      return isDarkMode() ? paletteSets.dark : paletteSets.light;
    }

    function defaultPalette() {
      return isDarkMode() ? "tech" : "aquatic";
    }

    function renderPaletteOptions(select, selected) {
      var allowed = validPalettes();
      select.innerHTML = "";

      allowed.forEach(function (palette) {
        var option = document.createElement("option");
        option.value = palette;
        option.textContent = paletteNames[palette];
        option.selected = palette === selected;
        select.appendChild(option);
      });
    }

    function applyPalette(palette, persist) {
      var allowed = validPalettes();
      if (allowed.indexOf(palette) === -1) palette = defaultPalette();

      document.documentElement.setAttribute("data-bsl-palette", palette);

      if (persist !== false) {
        try { localStorage.setItem("bsl-palette-v3", palette); } catch (e) {}
      }

      document.querySelectorAll("[data-bsl-palette-select]").forEach(function (select) {
        renderPaletteOptions(select, palette);
        select.value = palette;
        select.setAttribute("aria-label", "Palette: " + paletteNames[palette]);
        select.setAttribute("title", "Palette: " + paletteNames[palette]);
      });
    }

    function syncPaletteToMode() {
      var current = document.documentElement.getAttribute("data-bsl-palette");
      var allowed = validPalettes();

      if (allowed.indexOf(current) === -1) {
        current = defaultPalette();
      }

      applyPalette(current, true);
    }

    var currentPalette = document.documentElement.getAttribute("data-bsl-palette") || defaultPalette();
    applyPalette(currentPalette, false);

    document.querySelectorAll("[data-bsl-palette-select]").forEach(function (select) {
      select.addEventListener("change", function () {
        applyPalette(select.value, true);
      });
    });

    var paletteModeObserver = new MutationObserver(function (mutations) {
      mutations.forEach(function (mutation) {
        if (mutation.attributeName === "class") syncPaletteToMode();
      });
    });

    paletteModeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["class"]
    });

    document.querySelectorAll("[data-bsl-blog]").forEach(function (root) {
      var saved = localStorage.getItem("bsl-post-view");
      var view = saved === "grid" ? "grid" : "list";

      function setView(next) {
        view = next;
        root.setAttribute("data-view", next);
        localStorage.setItem("bsl-post-view", next);
        root.querySelectorAll("[data-bsl-view]").forEach(function (button) {
          var active = button.getAttribute("data-bsl-view") === next;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });
      }

      root.querySelectorAll("[data-bsl-view]").forEach(function (button) {
        button.addEventListener("click", function () {
          setView(button.getAttribute("data-bsl-view"));
        });
      });

      setView(view);

      var featuredButton = root.querySelector("[data-bsl-featured-toggle]");
      var featuredBody = root.querySelector("[data-bsl-featured-body]");
      if (featuredButton && featuredBody) {
        featuredButton.addEventListener("click", function () {
          var expanded = featuredButton.getAttribute("aria-expanded") === "true";
          featuredButton.setAttribute("aria-expanded", expanded ? "false" : "true");
          featuredButton.textContent = expanded
            ? (featuredButton.getAttribute("data-bsl-show") || "Mostrar")
            : (featuredButton.getAttribute("data-bsl-hide") || "Esconder");
          featuredBody.hidden = expanded;
        });
      }
    });
  });
</script>
